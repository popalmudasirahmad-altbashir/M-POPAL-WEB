<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M POPAL'S AI CHAT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="brand">
                <div class="brand-logo">M</div>

                <div class="brand-name">
                    <strong>M POPAL'S</strong>
                    <span>AI CHAT</span>
                </div>
            </div>

            <button class="close-sidebar" id="closeSidebar">
                ×
            </button>

        </div>


        <button class="new-chat" id="newChat">
            <span class="new-icon">＋</span>
            <span>New chat</span>
        </button>


        <div class="sidebar-section">

            <div class="section-title">
                Recent
            </div>

            <div class="history-list" id="historyList">

                <div class="history-item active">
                    <span>◌</span>
                    <span>New conversation</span>
                </div>

            </div>

        </div>


        <div class="sidebar-bottom">

            <button class="sidebar-button">
                <span>⚙</span>
                <span>Settings</span>
            </button>

            <button class="sidebar-button">
                <span>?</span>
                <span>Help</span>
            </button>


            <div class="account">

                <div class="account-avatar">
                    M
                </div>

                <div class="account-info">
                    <strong>M POPAL</strong>
                    <small>AI Chat</small>
                </div>

            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <div class="top-left">

                <button
                    class="menu-button"
                    id="menuButton">
                    ☰
                </button>

                <button class="model-selector">
                    M POPAL'S AI
                    <span>⌄</span>
                </button>

            </div>


            <div class="top-right">

                <button
                    class="top-button"
                    id="topNewChat">
                    ＋
                </button>

                <button class="top-button">
                    ⋯
                </button>

            </div>

        </header>


        <!-- CHAT -->
        <section
            class="chat-area"
            id="chatArea">

            <!-- WELCOME -->
            <div
                class="welcome"
                id="welcome">

                <div class="main-logo">
                    M
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask M POPAL'S AI anything.
                </p>


                <div class="suggestions">

                    <button class="suggestion">
                        <span>✦</span>
                        Explain something
                    </button>

                    <button class="suggestion">
                        <span>⌕</span>
                        Search the web
                    </button>

                    <button class="suggestion">
                        <span>✎</span>
                        Help me write
                    </button>

                    <button class="suggestion">
                        <span>◇</span>
                        Help me learn
                    </button>

                </div>

            </div>

        </section>


        <!-- INPUT -->
        <div class="input-container">

            <div class="input-box">

                <button
                    class="attach-button"
                    title="Attach">
                    ＋
                </button>


                <textarea
                    id="messageInput"
                    placeholder="Message M POPAL'S AI..."
                    rows="1"></textarea>


                <div class="input-tools">

                    <button
                        class="tool-button"
                        id="searchButton"
                        title="Web Search">
                        ⌕
                    </button>

                    <button
                        class="send-button"
                        id="sendButton"
                        disabled>
                        ↑
                    </button>

                </div>

            </div>


            <div class="disclaimer">
                M POPAL'S AI may make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
